[project]
name = "viet-asr-gateway"
version = "0.2.0rc1"
description = "OpenAI-compatible (scoped) serving for viet-asr (CPU, sherpa-onnx)"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Pinned together with the model in assets/manifest.json (tests/unit/test_manifests.py).
    "sherpa-onnx==1.13.8",
    "sherpa-onnx-core==1.13.8",
    "huggingface_hub",
    "numpy",
    "soundfile>=0.12",
    "soxr",
    "fastapi>=0.143.0",
    "uvicorn>=0.54.0",
    "python-multipart>=0.0.20",
    "websockets>=13,<16",
]

[dependency-groups]
dev = [
    "pytest",
    "pre-commit>=4.7.0",
    # Pinned SDK used to verify the API contract (docs/api-contract.vi.md).
    "openai[realtime]==3.31.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "model: needs the staged model assets (scripts/stage_models.py); runs on CPU",
    "container: needs docker (runtime checks: staged models)",
]
